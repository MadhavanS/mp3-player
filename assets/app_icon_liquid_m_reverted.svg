<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Glass Background Gradient -->
    <linearGradient id="glass_bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FDFCFB" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#E2D1C3" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glass Edge/Border Gradient -->
    <linearGradient id="glass_edge" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="white" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="white" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#A89E92" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Vibrant Multi-Color Gradient for the dots -->
    <linearGradient id="m_gradient" x1="120" y1="256" x2="392" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B84FF"/>    <!-- Electric Blue -->
      <stop offset="33%" stop-color="#A100FF"/>   <!-- Purple -->
      <stop offset="66%" stop-color="#FF007A"/>   <!-- Hot Pink -->
      <stop offset="100%" stop-color="#5FE3B3"/>  <!-- Mint Green -->
    </linearGradient>

    <!-- Liquid Glass "Follow" Effect Filter (The Trail) -->
    <filter id="liquid_trail" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feOffset in="blur" dx="0" dy="6" result="offsetBlur"/>
      <feComponentTransfer in="offsetBlur" result="trail">
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="trail"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
      <feOffset dx="0" dy="12" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Liquid Glass Base Plate -->
  <rect x="64" y="64" width="384" height="384" rx="100" fill="url(#glass_bg)" filter="url(#soft_shadow)"/>

  <!-- Glass Surface Highlight -->
  <rect x="64" y="64" width="384" height="384" rx="100" stroke="url(#glass_edge)" stroke-width="6"/>

  <!-- Frequency "M" composed of Circles/Dots with Liquid Trails -->
  <g fill="url(#m_gradient)" filter="url(#liquid_trail)">
    <!-- Column 1: Left Leg -->
    <circle cx="125" cy="170" r="10"/><circle cx="125" cy="206" r="12"/><circle cx="125" cy="242" r="14"/><circle cx="125" cy="278" r="15"/><circle cx="125" cy="314" r="14"/><circle cx="125" cy="350" r="12"/><circle cx="125" cy="386" r="10"/>

    <circle cx="158" cy="190" r="9"/><circle cx="158" cy="226" r="11"/><circle cx="158" cy="262" r="12"/><circle cx="158" cy="298" r="11"/><circle cx="158" cy="334" r="9"/><circle cx="158" cy="370" r="7"/>

    <!-- Column 2: First Valley -->
    <circle cx="191" cy="210" r="8"/><circle cx="191" cy="246" r="10"/><circle cx="191" cy="282" r="11"/><circle cx="191" cy="318" r="10"/><circle cx="191" cy="354" r="8"/>

    <circle cx="224" cy="230" r="7"/><circle cx="224" cy="266" r="9"/><circle cx="224" cy="302" r="8"/><circle cx="224" cy="334" r="6"/>

    <!-- Column 3: Center Peak / Dip Junction -->
    <circle cx="256" cy="250" r="6"/><circle cx="256" cy="286" r="8"/><circle cx="256" cy="322" r="6"/>

    <!-- Column 4: Second Valley -->
    <circle cx="288" cy="230" r="7"/><circle cx="288" cy="266" r="9"/><circle cx="288" cy="302" r="8"/><circle cx="288" cy="334" r="6"/>

    <circle cx="321" cy="210" r="8"/><circle cx="321" cy="246" r="10"/><circle cx="321" cy="282" r="11"/><circle cx="321" cy="318" r="10"/><circle cx="321" cy="354" r="8"/>

    <!-- Column 5: Right Leg -->
    <circle cx="354" cy="190" r="9"/><circle cx="354" cy="226" r="11"/><circle cx="354" cy="262" r="12"/><circle cx="354" cy="298" r="11"/><circle cx="354" cy="334" r="9"/><circle cx="354" cy="370" r="7"/>

    <circle cx="387" cy="170" r="10"/><circle cx="387" cy="206" r="12"/><circle cx="387" cy="242" r="14"/><circle cx="387" cy="278" r="15"/><circle cx="387" cy="314" r="14"/><circle cx="387" cy="350" r="12"/><circle cx="387" cy="386" r="10"/>
  </g>

  <!-- Subtle Internal Reflection Overlay -->
  <g fill="none" stroke="white" stroke-width="1.5" stroke-opacity="0.2">
    <circle cx="125" cy="170" r="11"/><circle cx="256" cy="286" r="9"/><circle cx="387" cy="170" r="11"/>
  </g>

  <!-- Glass Plate Top Reflection -->
  <rect x="80" y="80" width="352" height="150" rx="75" fill="white" fill-opacity="0.1"/>
  <path d="M110 100 Q 80 100, 80 130" stroke="white" stroke-width="8" stroke-linecap="round" stroke-opacity="0.4"/>
</svg>