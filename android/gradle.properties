org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Avoid stale R.jar / processDebugResources failures after AGP upgrades on Windows.
org.gradle.caching=false
org.gradle.configuration-cache=false
android.useAndroidX=true
android.enableJetifier=true
# Kotlin incremental compile fails on Windows when project and pub cache are on different drives (e.g. D: vs C:).
kotlin.incremental=false
# Built-in Kotlin (app module); plugins may still use KGP until they migrate.
android.builtInKotlin=true
android.newDsl=true
